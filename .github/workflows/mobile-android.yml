name: Build KK Ticket Android APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "mobile/**"
      - "app/mobile*.py"
      - ".github/workflows/mobile-android.yml"
  push:
    branches:
      - "feature/mobile-app-batch-scanner"
    paths:
      - "mobile/**"
      - "app/mobile*.py"
      - ".github/workflows/mobile-android.yml"

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node mobile/tests/scan.test.cjs

  android-debug-standalone:
    runs-on: ubuntu-latest
    needs: unit-tests
    defaults:
      run:
        working-directory: mobile
    env:
      CI: "true"
      EXPO_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install required Android SDK
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Install Expo dependencies
        run: npm install --no-audit --no-fund
      - name: Generate Android project
        run: npx expo prebuild --platform android --non-interactive
      - name: Bundle JS in debug APK (no development server needed)
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          path = Path("android/app/build.gradle")
          s = path.read_text()
          s = re.sub(r"(?m)^(\s*)debuggableVariants\s*=\s*\[[^\]]*\]", r"\1debuggableVariants = []", s)
          if not re.search(r"(?m)^\s*debuggableVariants\s*=\s*\[\]", s):
              if "react {" not in s:
                  raise SystemExit("React Gradle config not found")
              s = s.replace("react {", "react {\n    debuggableVariants = []", 1)
          path.write_text(s)
          PY
      - name: Build installable standalone APK
        run: cd android && chmod +x gradlew && ./gradlew :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: kk-ticket-android-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
